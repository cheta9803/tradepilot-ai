<app-section-card title="Open Positions">

  <table
    mat-table
    [dataSource]="dataSource()"
    class="w-100">

    <ng-container matColumnDef="symbol">
      <th mat-header-cell *matHeaderCellDef>Symbol</th>
      <td mat-cell *matCellDef="let row">
        <strong>{{ row.symbol }}</strong>
      </td>
    </ng-container>

    <ng-container matColumnDef="quantity">
      <th mat-header-cell *matHeaderCellDef>Qty</th>
      <td mat-cell *matCellDef="let row">
        {{ row.quantity }}
      </td>
    </ng-container>

    <ng-container matColumnDef="averagePrice">
      <th mat-header-cell *matHeaderCellDef>Avg</th>
      <td mat-cell *matCellDef="let row">
        {{ row.averagePrice | number:'1.2-2' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="ltp">
      <th mat-header-cell *matHeaderCellDef>LTP</th>
      <td mat-cell *matCellDef="let row">
        {{ row.ltp | number:'1.2-2' }}
      </td>
    </ng-container>

    <ng-container matColumnDef="pnl">
      <th mat-header-cell *matHeaderCellDef>P&L</th>
      <td
        mat-cell
        *matCellDef="let row"
        [class.text-success]="row.pnl >= 0"
        [class.text-danger]="row.pnl < 0">

        {{ row.pnl | number:'1.2-2' }}

      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

  </table>

</app-section-card>
