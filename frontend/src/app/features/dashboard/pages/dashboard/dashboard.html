<app-page-header
  title="Dashboard"
  subtitle="Welcome back">
</app-page-header>

<app-summary-cards></app-summary-cards>

<div class="widgets">

  <app-section-card title="Market Indices">

    @for (index of dashboard.indices(); track index.name) {
      <p>{{ index.name }} - {{ index.value }}</p>
    }

  </app-section-card>

  <app-section-card title="Open Positions">

    @for (position of dashboard.positions(); track position.symbol) {
      <p>{{ position.symbol }} - {{ position.pnl }}</p>
    }

  </app-section-card>

</div>
