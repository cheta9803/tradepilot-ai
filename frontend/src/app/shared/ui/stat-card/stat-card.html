<mat-card appearance="outlined">

  <mat-card-content>

    <div class="header">

      <span>{{ title() }}</span>

      <mat-icon>{{ icon() }}</mat-icon>

    </div>

    <div class="value" [class.profit]="valueClass() === 'profit'" [class.loss]="valueClass() === 'loss'"
      [class.neutral]="valueClass() === 'neutral'">

      {{ value() }}

    </div>

  </mat-card-content>

</mat-card>
